[package]
org = "apostille-me"
name = "apme-cli"
version = "0.1.0"
description = "Command-line interface for Apostille Me"
license = "MIT"
language = "rust"

[package.repository]
vcs = "git"
url = "https://github.com/apostille-me/apme-cli"

[publish]
include_readme = true
tag_format = "v{version}"
smoke_test = "test -x \"$ZED_PKG_TEST_TARGET/target/release/apme-cli\" && \"$ZED_PKG_TEST_TARGET/target/release/apme-cli\" --help >/dev/null"
exclude = [".env", ".env.*", ".direnv/**", ".zed/**", ".zed-pack/**", "node_modules/**", ".vendor/.zed/**", "target/**", "tmp/**", "dist/**", "*.log", ".DS_Store"]

[dependencies]
"apostille-me/apme-clients" = "^0.1.0"
"apostille-me/apme-interfaces" = "^0.1.0"
"apostille-me/apme-libs" = "^0.1.0"

[install]
dir = ".vendor/.zed"
adapter = "none"

[build]
command = "cargo build --release --locked --bin apme-cli"
outputs = ["target/release/apme-cli"]

[bin]
apme-cli = "target/release/apme-cli"

[scripts]
test = "cargo test --all-targets --locked"

[targets.repository]
dir = "."
