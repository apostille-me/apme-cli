[package]
org = "apostille-me"
name = "apme-cli"
version = "0.1.0"
description = "Command-line interface for Apostille Me"
license = "MIT"
language = "rust"

[package.repository]
vcs = "git"
url = "https://github.com/apostille-me/apme-cli"

[publish]
include_readme = true
tag_format = "v{version}"
exclude = [".env", ".env.*", "node_modules/**", ".vendor/.zed/**", "target/**", "dist/**", "*.log"]

[dependencies]
"apostille-me/apme-clients" = "^0.1.0"
"apostille-me/apme-interfaces" = "^0.1.0"
"apostille-me/apme-lib" = "^0.1.0"

[install]
dir = ".vendor/.zed"
adapter = "rust"
